spring.application.name=most

server.port=${PORT:8080}

# ── PostgreSQL ──────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:most}}
spring.datasource.username=${PGUSER:${SPRING_DATASOURCE_USERNAME:most}}
spring.datasource.password=${PGPASSWORD:${SPRING_DATASOURCE_PASSWORD:most}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ───────────────────────────────────────
spring.flyway.baseline-on-migrate=true

# ── Security ─────────────────────────────────────
most.security.jwt.secret=${JWT_SECRET:this-is-a-very-long-secret-key-for-hs256-which-must-be-at-least-256-bits-long}

