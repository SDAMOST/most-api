spring.application.name=most

# ── PostgreSQL ──────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/most
spring.datasource.username=most
spring.datasource.password=most
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Security ─────────────────────────────────────
most.security.jwt.secret=this-is-a-very-long-secret-key-for-hs256-which-must-be-at-least-256-bits-long

